language: java

matrix:
  include:
    - os: linux
      jdk: oraclejdk8
    - os: linux
      jdk: oraclejdk7
    - os: linux
      jdk: openjdk7
    - os: osx

cache:
  directories:
  - $HOME/.m2

install: mvn install -DskipTests=true -Dmaven.javadoc.skip=true -Dgpg.skip -B -V

script: mvn test -Dgpg.skip
